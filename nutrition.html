<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품 정보 | 도쿄베이커리</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin: 40px 0;
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .info-table th, .info-table td {
            padding: 20px;
            text-align: left;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .info-table th {
            background-color: var(--brand-brown-dark);
            color: #fff;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <nav>
        <div class="container nav-container">
            <a href="./index.html" class="logo">도쿄베이커리</a>
            <div class="nav-links">
                <a href="./index.html">홈</a>
                <a href="./about.html">브랜드 스토리</a>
                <a href="./nutrition.html" style="color: var(--brand-accent);">제품 정보</a>
                <a href="tel:010-3780-1860">문의하기</a>
            </div>
        </div>
    </nav>

    <section class="container" style="margin-top: 100px;">
        <div class="reveal" style="text-align: center; margin-bottom: 60px;">
            <h1 class="serif" style="font-size: 3rem;">상세 제품 정보</h1>
            <p>우리가 만드는 제품에 대한 정직한 약속</p>
        </div>

        <div class="grid" style="grid-template-columns: 1.5fr 1fr; gap: 40px;">
            <div class="reveal">
                <h3 class="serif accent">기본 정보</h3>
                <table class="info-table">
                    <tr><th>제품명</th><td>도라야끼</td></tr>
                    <tr><th>식품 유형</th><td>양과자</td></tr>
                    <tr><th>내용량</th><td>80g</td></tr>
                    <tr><th>소비기한</th><td>후면 하단 별도 표기일까지</td></tr>
                </table>

                <h3 class="serif accent" style="margin-top: 40px;">원재료명</h3>
                <div style="background: #fff; padding: 30px; border-radius: 15px; margin-top: 20px; border: 1px solid rgba(0,0,0,0.05);">
                    팥앙금 33.3% [팥(중국산), 설탕, 물엿, 발다이스(중국산)], 한천분말, 소금, 밀가루(밀:미국산), 계란(국산), 설탕, 물엿, 채종유, 미림, 양조간장, 베이킹파우더 등
                </div>
            </div>

            <div class="reveal">
                <h3 class="serif accent">영양성분 (80g당)</h3>
                <div style="background: var(--brand-brown-dark); color: #fff; padding: 40px; border-radius: 20px; margin-top: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                        <span style="opacity: 0.7;">총 칼로리</span>
                        <span style="font-size: 2.5rem; font-weight: 700;">220 kcal</span>
                    </div>
                    <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;"><span>탄수화물</span><span>44g (11%)</span></div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; opacity: 0.6; font-size: 0.9rem;"><span>- 당류</span><span>12.3g</span></div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;"><span>단백질</span><span>4.9g (7%)</span></div>
                        <div style="display: flex; justify-content: space-between;"><span>지방</span><span>2.4g (4%)</span></div>
                    </div>
                </div>
                
                <div style="margin-top: 40px; border-radius: 20px; overflow: hidden;">
                    <img src="./images/nutrition_label.jpg" alt="영양성분표" style="width: 100%;">
                </div>
            </div>
        </div>
    </section>

    <script src="./script.js"></script>
</body>
</html>
